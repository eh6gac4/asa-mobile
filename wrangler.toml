name = "asa-mobile"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 毎日 20:00 UTC(前日) = 5:00 JST (本番) / 00:00 UTC = 9:00 JST (Gemini一時エラー時のリトライ)
# TLDR AI(日刊)は毎回取得するが、Android/iOS Weekly(週刊)は本番cron側で
# 月曜のみに絞る(src/index.jsのisWeeklyRefreshDay参照)。JST基準の月曜なので
# UTC上の発火日とはズレる(前日20:00 UTC = 翌日5:00 JST)ことに注意。
# リトライ側の文字列はsrc/index.jsのRETRY_CRONと一致させること。
[triggers]
crons = ["0 20 * * *", "0 0 * * *"]

# `npx wrangler kv namespace create DIGEST_KV` を実行して出力された id を
# 下の "REPLACE_ME_WITH_KV_NAMESPACE_ID" に貼り付けること。
[[kv_namespaces]]
binding = "DIGEST_KV"
id = "c464f4638cd34b3ab9ba816bfe409cb1"
