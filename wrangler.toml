name = "asa-mobile"
main = "src/index.js"
compatibility_date = "2026-08-01"

# 毎週月曜 00:00 UTC = 9:00 JST
[triggers]
crons = ["0 0 * * 1"]

# `npx wrangler kv namespace create DIGEST_KV` を実行して出力された id を
# 下の "REPLACE_ME_WITH_KV_NAMESPACE_ID" に貼り付けること。
[[kv_namespaces]]
binding = "DIGEST_KV"
id = "REPLACE_ME_WITH_KV_NAMESPACE_ID"
